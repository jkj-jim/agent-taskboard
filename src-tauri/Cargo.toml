[package]
name = "agent-taskboard"
version = "0.1.1"
description = "Agent Taskboard"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
