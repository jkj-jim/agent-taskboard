[package]
name = "agent-taskboard"
version = "0.1.3"
description = "Agent Taskboard"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
libc = "0.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
